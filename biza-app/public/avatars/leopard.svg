<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Leopard avatar">
  <!-- Solid forest background -->
  <circle cx="50" cy="50" r="46" fill="#1A3A2A"/>
  
  <!-- Head shape with ears -->
  <!-- Main head outline -->
  <path d="M 32 36 C 24 36 24 46 24 58 C 24 70 36 74 50 74 C 64 74 76 70 76 58 C 76 46 76 36 68 36 Z" stroke="#F5C842" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Ear outlines -->
  <path d="M 32 36 C 32 24 20 22 24 36" stroke="#F5C842" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 68 36 C 68 24 80 22 76 36" stroke="#F5C842" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Inner Ear lines -->
  <path d="M 28 32 Q 26 27 28 31" stroke="#F5C842" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 72 32 Q 74 27 72 31" stroke="#F5C842" stroke-width="3" stroke-linecap="round" fill="none"/>
  
  <!-- Eyes -->
  <circle cx="38" cy="48" r="2.5" fill="#F5C842"/>
  <circle cx="62" cy="48" r="2.5" fill="#F5C842"/>
  <path d="M 33 46 Q 38 42 43 46" stroke="#F5C842" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 67 46 Q 62 42 57 46" stroke="#F5C842" stroke-width="3" stroke-linecap="round" fill="none"/>
  
  <!-- Nose and Mouth -->
  <path d="M 45 54 L 55 54 L 50 58 Z" fill="#F5C842"/>
  <path d="M 50 58 L 50 63 Q 50 66 47 66 M 50 58 Q 50 66 53 66" stroke="#F5C842" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Hollow spots exactly as in reference image -->
  <!-- Forehead spots -->
  <circle cx="50" cy="42" r="2" stroke="#F5C842" stroke-width="3" fill="none"/>
  <circle cx="42" cy="37" r="2" stroke="#F5C842" stroke-width="3" fill="none"/>
  <circle cx="58" cy="37" r="2" stroke="#F5C842" stroke-width="3" fill="none"/>
  <!-- Cheek/side spots -->
  <circle cx="30" cy="55" r="2" stroke="#F5C842" stroke-width="3" fill="none"/>
  <circle cx="28" cy="62" r="2" stroke="#F5C842" stroke-width="3" fill="none"/>
  <circle cx="70" cy="55" r="2" stroke="#F5C842" stroke-width="3" fill="none"/>
  <circle cx="72" cy="62" r="2" stroke="#F5C842" stroke-width="3" fill="none"/>
</svg>